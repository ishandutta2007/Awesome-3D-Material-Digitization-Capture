<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .neon-path { fill: none; stroke-width: 2; opacity: 0.7; }
    
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(40px, -30px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-35px, 25px); }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: center; }
    .circuit-line { stroke-dasharray: 20, 10; animation: dashTravel 30s linear infinite; }
    .badge-float-1 { animation: floatBadge 4s ease-in-out infinite; }
    .badge-float-2 { animation: floatBadge 4.8s ease-in-out infinite 0.8s; }
    .badge-float-3 { animation: floatBadge 5.2s ease-in-out infinite 1.6s; }
    .badge-float-4 { animation: floatBadge 4.5s ease-in-out infinite 2.2s; }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .main-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Deep Sci-Fi / Creative Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- Background Isometric / Perspective Mesh Grid -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Dynamic Ambient Glowing Orbs in the Background (non-obstructive) -->
  <g filter="url(#glowOrb)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#6366f1" opacity="0.22"/>
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#ec4899" opacity="0.18"/>
    <circle class="orb-1" cx="600" cy="350" r="120" fill="#06b6d4" opacity="0.15"/>
  </g>

  <!-- Animated Circuit / Material Stream Lines in background -->
  <g class="neon-path circuit-line" opacity="0.35">
    <path d="M -50,300 C 300,350 450,220 800,290 C 1000,330 1150,260 1250,280" stroke="#38bdf8"/>
    <path d="M -50,100 C 250,50 500,160 850,90 C 1050,40 1150,120 1250,110" stroke="#a855f7"/>
  </g>

  <!-- 3D PBR Material Sphere Schematic in Background -->
  <g transform="translate(1000, 200)" opacity="0.35">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6, 6"/>
    <ellipse cx="0" cy="0" rx="85" ry="32" fill="none" stroke="#818cf8" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="32" ry="85" fill="none" stroke="#818cf8" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitle & Interactive Pills (High Contrast, Crystal Clear) -->
  <g transform="translate(80, 0)">
    <!-- Top Micro Tagline -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="285" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="26" y="18" class="tagline">3D Material &amp; PBR Engine</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="main-title" fill="url(#titleGradient)">
      Awesome 3D Material Digitization
    </text>

    <!-- Subtitle -->
    <text x="0" y="208" class="main-subtitle">
      Curated Ecosystem for Photo-to-PBR Conversion, SVBRDF Capture &amp; Procedural Texturing
    </text>

    <!-- Feature Highlights Floating Pills (In Foreground) -->
    <g transform="translate(0, 255)">
      <!-- Pill 1: Photo-to-PBR -->
      <g class="badge-float-1" transform="translate(0, 0)">
        <rect width="170" height="38" rx="19" fill="url(#cyanPill)" stroke="#0284c7" stroke-width="1.2"/>
        <text x="85" y="24" text-anchor="middle" class="pill-text" fill="#38bdf8">📸 Photo-to-PBR</text>
      </g>

      <!-- Pill 2: Procedural Nodes -->
      <g class="badge-float-2" transform="translate(185, 0)">
        <rect width="180" height="38" rx="19" fill="url(#purplePill)" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="90" y="24" text-anchor="middle" class="pill-text" fill="#c084fc">🎛️ Procedural Graphs</text>
      </g>

      <!-- Pill 3: AI & SVBRDF -->
      <g class="badge-float-3" transform="translate(380, 0)">
        <rect width="190" height="38" rx="19" fill="url(#emeraldPill)" stroke="#059669" stroke-width="1.2"/>
        <text x="95" y="24" text-anchor="middle" class="pill-text" fill="#34d399">⚡ AI Material Capture</text>
      </g>

      <!-- Pill 4: Open-Source & SaaS -->
      <g class="badge-float-4" transform="translate(585, 0)">
        <rect width="190" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <text x="95" y="24" text-anchor="middle" class="pill-text" fill="#e2e8f0">🌐 SaaS &amp; Open Source</text>
      </g>
    </g>
  </g>
</svg>